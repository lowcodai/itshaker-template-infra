name: Docker Build

on:
  push:
    paths:
      - 'docker/**'
      - '**/Dockerfile*'
  pull_request:
    paths:
      - 'docker/**'
      - '**/Dockerfile*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ github.repository }}:${{ github.sha }}
